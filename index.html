<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>서울 라이브</title>
    <meta name="description" content="서울 주요 명소의 실시간 인파를 지도에서 봅니다." />
    <!--
      **여기 값들은 매니페스트와 같아야 한다.** 매니페스트(`vite.config.ts`의
      `pwa()`)는 설치된 뒤에 읽히고, 이 메타 태그들은 설치되기 **전** 브라우저
      탭에서 읽힌다 — 갈리면 설치 전후로 색이 바뀐다.

      `theme_color`가 파랑이 아니라 표면색인 이유도 그쪽에 적어 뒀다.
    -->
    <!--
      두 벌인 이유가 다크 모드다. 브라우저는 `media`가 맞는 첫 줄을 쓰므로
      순서가 곧 우선순위다. 한 벌만 두면 밤에 주소창만 크림색으로 남아
      화면 위쪽에 밝은 띠가 생긴다. 값은 `index.css`의 `--color-surface`와
      그 다크 짝(`--color-dark-surface`)이다 — 갈리면 주소창과 화면 맨
      윗줄 사이에 경계선이 보인다.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16120c" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fffbf4" />

    <!--
      브라우저 기본 UI(스크롤바, 폼 컨트롤, `input` 캐럿)에게 두 모드를 다
      지원한다고 알린다. 이게 없으면 다크에서 스크롤바만 밝게 남는다.
    -->
    <meta name="color-scheme" content="light dark" />

    <!--
      iOS는 웹 매니페스트를 반쪽만 읽는다. 홈 화면 아이콘과 전체화면 여부는
      아직도 `apple-` 접두사 메타를 본다 — 매니페스트의 `icons`·`display`가
      있어도 이것들이 없으면 사파리가 스크린샷을 아이콘으로 쓰고 주소창을 남긴다.
      `mobile-web-app-capable`은 그 표준판이고, 크롬이 이쪽을 본다. 둘 다 둔다.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="서울라이브" />
    <!--
      `black-translucent`가 아니라 `default`다. 반투명으로 두면 상태 표시줄이
      내용 위에 겹쳐 뜨는데, 이 앱의 화면 맨 위 0~112px은 검색 바와 필터 칩이
      차지하고 있어 시계와 겹친다(그 112px은 Task 10에서 실측한 값이다).
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      **웹폰트를 쓰지 않는다.** 예전에는 Hanken Grotesk 4종을 Google Fonts에서
      받았는데(실측 229KB: CSS 964B + woff2 4개 × 57KB) 그 폰트에는 한글
      글리프가 없어서 **화면 글자의 대부분은 어차피 기기 폰트로 그려졌다.**
      229KB와 렌더 블로킹 요청이 숫자와 라틴 몇 글자를 위해 쓰인 셈이다.

      한 줄 안에서 서체가 갈리는 것이 더 나빴다 — 「추정 인구 88,000~90,000명」
      에서 숫자는 Hanken, 「명」은 시스템 폰트라 x-height와 굵기가 어긋났다.

      Pretendard로 갈아타는 길도 재 봤다. 동적 서브셋이 조각당 평균 35KB라
      200~700KB이고, **미리 서브셋을 뜨는 길은 막혀 있다** — `snapshot.message`와
      재난문자가 서울 API에서 오는 임의의 한글이라 글리프를 예측할 수 없다.
      빠진 음절이 문장 중간에서 조용히 폴백된다.

      그래서 폰트 스택은 `index.css`의 `--font-sans` 하나이고 전부 기기 것이다.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
