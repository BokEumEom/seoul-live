<!--
  앱 아이콘의 정본. PNG(192/512/애플 180)는 전부 이 파일에서 렌더한다 —
  `scripts/render-icons.mjs` 참조. 색과 모양을 고치려면 여기만 고치고 다시 렌더한다.

  **핀 모양은 지도 마커(`CongestionMarker`)와 같은 path다.** 아이콘과 화면 안의
  마커가 같은 실루엣이라야 「이 앱이 그 앱이다」가 성립한다.

  **빨간 점은 임의의 빨강이 아니라 `--color-crowded`(#dc2626)다.** 이 앱에서
  빨강은 「붐빔」이라는 뜻을 이미 갖고 있고, 아이콘의 점도 같은 말을 한다 —
  실시간으로 붐빔을 보는 앱. 파랑 바탕은 `--color-primary`(#004ac6)다.

  **마스커블 안전지대(가운데 80%)를 지킨다.** 512 기준 안전 영역은 51.2~460.8인데
  핀은 x 158~354, y 116~396에 있다. 그래서 이 그림 하나로 `any`와 `maskable`을
  겸한다 — 안드로이드가 원형·물방울 어느 모양으로 잘라도 핀이 안 잘린다.
  바탕을 꽉 채우는 것도 그 규격의 요구다(투명하면 잘린 자리가 검게 남는다).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#004ac6" />
  <g transform="translate(256 256) scale(14) translate(-12 -12)">
    <path
      fill="#ffffff"
      d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"
    />
  </g>
  <circle cx="256" cy="214" r="35" fill="#dc2626" />
</svg>
