<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.08);

            0%, 100% { transform: scale(1); opacity: 1; }

<body class="bg-background text-on-background font-body-md selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Top Navigation Bar (Shared Component Strategy) -->
<header class="bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl flex justify-between items-center px-container-padding h-14 w-full fixed top-0 z-50 border-b border-outline-variant dark:border-outline">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
<h1 class="text-headline-md-mobile font-headline-md-mobile font-bold text-primary dark:text-primary-fixed-dim">Seoul Live</h1>
</div>
<div class="flex gap-4">

<!-- Main Map Canvas -->

</div>
<!-- Dynamic Map Pins -->
<div class="absolute inset-0 pointer-events-none z-10">
<!-- Red Pin (Crowded) -->
<div class="absolute top-[40%] left-[65%] pointer-events-auto cursor-pointer group">
<div class="relative flex flex-col items-center">
<div class="bg-error text-white px-3 py-1 rounded-full text-label-sm font-label-sm shadow-lg mb-1 animate-pulse-soft">붐빔</div>
<span class="material-symbols-outlined text-error text-[32px] drop-shadow-md" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
</div>
<!-- Green Pin (Relaxed) -->
<div class="absolute top-[30%] left-[30%] pointer-events-auto cursor-pointer">
<div class="relative flex flex-col items-center">
<div class="bg-emerald-500 text-white px-3 py-1 rounded-full text-label-sm font-label-sm shadow-lg mb-1">여유</div>
<span class="material-symbols-outlined text-emerald-500 text-[32px] drop-shadow-md" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
</div>
<!-- Yellow Pin (Normal) -->
<div class="absolute top-[55%] left-[50%] pointer-events-auto cursor-pointer">
<div class="relative flex flex-col items-center">
<div class="bg-amber-400 text-on-surface px-3 py-1 rounded-full text-label-sm font-label-sm shadow-lg mb-1">보통</div>
<span class="material-symbols-outlined text-amber-400 text-[32px] drop-shadow-md" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
</div>
</div>
<!-- Floating UI Components -->
<div class="absolute top-4 left-0 right-0 px-4 z-20 flex flex-col gap-3">

                </button>

<!-- Bottom Navigation Bar (Shared Component Strategy) -->
<nav class="bg-surface dark:bg-inverse-surface shadow-lg fixed bottom-0 w-full z-50 flex justify-around items-center px-2 py-3 pb-safe rounded-t-xl">
<div class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary-fixed-dim text-on-secondary-container dark:text-on-secondary-fixed rounded-2xl px-4 py-1.5 active:scale-90 duration-150 cursor-pointer">
<span class="material-symbols-outlined" data-icon="map" style="font-variation-settings: 'FILL' 1;">map</span>
<span class="font-label-sm text-label-sm">지도</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1.5 active:scale-90 duration-150 cursor-pointer hover:bg-surface-container-low dark:hover:bg-surface-variant/20">
<span class="material-symbols-outlined" data-icon="near_me">near_me</span>
<span class="font-label-sm text-label-sm">내 주변</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1.5 active:scale-90 duration-150 cursor-pointer hover:bg-surface-container-low dark:hover:bg-surface-variant/20">
<span class="material-symbols-outlined" data-icon="trending_up">trending_up</span>
<span class="font-label-sm text-label-sm">혼잡예보</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1.5 active:scale-90 duration-150 cursor-pointer hover:bg-surface-container-low dark:hover:bg-surface-variant/20">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
<span class="font-label-sm text-label-sm">더보기</span>
</div>
</nav>
<script>
        // Simple Interaction for Bottom Sheet
        let startY = 0;
        const sheet = document.getElementById('bottom-sheet');
        
        sheet.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        });

        sheet.addEventListener('touchend', (e) => {
            const endY = e.changedTouches[0].clientY;
            if (endY > startY + 50) {
                // Drag down to hide partially or minimize
                sheet.style.transform = 'translateY(120px)';
            } else if (endY < startY - 50) {
                // Drag up to show full
                sheet.style.transform = 'translateY(0)';
            }
        });

        // Toggle Active State simulation
        const navItems = document.querySelectorAll('nav > div');
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                navItems.forEach(nav => {
                    nav.className = 'flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1.5 active:scale-90 duration-150 cursor-pointer hover:bg-surface-container-low dark:hover:bg-surface-variant/20';
                    const icon = nav.querySelector('.material-symbols-outlined');
                    if (icon) icon.style.fontVariationSettings = "'FILL' 0";
                });
                item.className = 'flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary-fixed-dim text-on-secondary-container dark:text-on-secondary-fixed rounded-2xl px-4 py-1.5 active:scale-90 duration-150 cursor-pointer';
                const activeIcon = item.querySelector('.material-symbols-outlined');
                if (activeIcon) activeIcon.style.fontVariationSettings = "'FILL' 1";
            });
        });
    </script>
